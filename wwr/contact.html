<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Waitamu Ronald">
    <meta name="description" content="Contact River Rush Adventures for rafting reservations, general inquiries, and information about our services.">

    <title>Contact Us | River Rush Adventures</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- Header -->
    <header>

        <img src="images/rafting-logo.png" alt="River Rush Adventures Logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <!-- Main Content -->
    <main class="contact-main">

        <!-- Company Contact Information -->
        <section class="company-info">

            <h1>River Rush Adventures</h1>

            <p><strong>123 Main River Street</strong></p>
            <p><strong>Kolob, California</strong></p>
            <p><strong>+1 999 999 9999</strong></p>
            <p><strong>info@riverrushadventures.com</strong></p>

        </section>

        <!-- Map and Contact Form -->
        <section class="contact-content">

            <!-- Google Map -->
            <div class="map-container">

                <iframe
                    src="https://www.google.com/maps?q=Kolob%2C%20California&output=embed"
                    title="Map showing River Rush Adventures location"
                    width="100%"
                    height="350"
                    loading="lazy"
                    allowfullscreen>
                </iframe>

            </div>

            <!-- Contact Form -->
            <form class="contact-form" action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname"
                        placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email address" required>
                </div>

                <fieldset>

                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose"
                            value="general-inquiry" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose"
                            value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose"
                            value="website-suggestion">
                        Website Suggestion
                    </label>

                </fieldset>

                <div class="form-group message-group">

                    <label for="message">Message</label>

                    <textarea id="message" name="message"
                        placeholder="Type your message here..."
                        rows="5" required></textarea>

                </div>

                <div class="newsletter">

                    <input type="checkbox" id="subscribe"
                        name="subscribe">

                    <label for="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>

                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

        <!-- Employee Profiles -->
        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-container">

                <figure>
                    <img src="images/employee1.jpg"
                        alt="River Rush Adventures customer service representative">
                    <figcaption>
                        Ronald Waitamu<br>
                        Customer Service Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg"
                        alt="River Rush Adventures rafting guide">
                    <figcaption>
                        James Miller<br>
                        Head Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                        alt="River Rush Adventures reservations officer">
                    <figcaption>
                        Sarah Johnson<br>
                        Reservations Officer
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 River Rush Adventures | Waitamu Ronald</p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>
</html>
